# Met AVA à jour toutes les 30 minutes et publie le site (GitHub Pages).
name: AVA · collecte et publication

on:
  schedule:
    - cron: '*/30 * * * *'      # toutes les 30 minutes : le temps d'analyser le sens de chaque article
  workflow_dispatch:            # bouton « Run workflow » pour lancer à la main
  push:
    branches: [main]
    paths-ignore: ['donnees/**', 'collecte/etat/**']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ava
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: macos-latest       # macOS : pour l'analyse des photos (visages, beauté) intégrée au système
    timeout-minutes: 25
    env:
      CLE_IA: ${{ secrets.ANTHROPIC_API_KEY }}   # vide tant que la clé n'est pas enregistrée : l'étape Claude est alors sautée
    steps:
      - uses: actions/checkout@v4
      - name: Préparer l'outil d'analyse des photos
        run: swiftc -O collecte/photos/noter.swift -o collecte/photos/noter
      - name: Préparer l'outil qui comprend le sens des articles
        run: swiftc -O collecte/sens/sens.swift -o collecte/sens/sens
      - name: Collecter l'actualité
        working-directory: collecte
        run: python3 collecte.py
      - uses: actions/setup-python@v5
        if: ${{ env.CLE_IA != '' }}
        with:
          python-version: '3.12'
      - name: Titres en français et résumés (Claude)
        if: ${{ env.CLE_IA != '' }}
        working-directory: collecte
        timeout-minutes: 10
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -m pip install --quiet anthropic
          python ia.py
      - name: Enregistrer l'actualité
        run: |
          git config user.name "AVA"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add donnees collecte/etat
          git diff --cached --quiet && exit 0
          git commit -m "Actualité du $(date -u '+%d/%m %H:%M') UTC"
          git pull --rebase --strategy-option=theirs origin main || true
          git push

  publication:
    needs: collecte
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deploiement
        uses: actions/deploy-pages@v4
